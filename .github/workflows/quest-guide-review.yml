name: Quest guide review

on:
  push:
    branches: [codex/quest-supply-preparation-audit, codex/early-ardougne-cloak]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-guide-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build production guide
        run: npm run build
      - name: Install isolated browser verification tools
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check progress, links, keyboard access and mobile layout
        env:
          GUIDE_AUDIT_BASE: ae8000f11964e2835ffd90d232a29639389ec21a
        run: node scripts/verify-quest-supply-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-guide-review
          path: audit-artifacts/
          if-no-files-found: warn
